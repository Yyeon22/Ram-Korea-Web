<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="도시 데이터 분석을 추상화한 그래픽">
  <defs>
    <linearGradient id="w6bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27313f"/>
      <stop offset="1" stop-color="#141b25"/>
    </linearGradient>
    <linearGradient id="w6bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.19"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#w6bg)"/>

  <!-- 데이터 격자 -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="120" cy="140" r="3"/><circle cx="200" cy="140" r="3"/><circle cx="280" cy="140" r="3"/>
    <circle cx="360" cy="140" r="3"/><circle cx="440" cy="140" r="3"/><circle cx="520" cy="140" r="3"/>
    <circle cx="600" cy="140" r="3"/><circle cx="680" cy="140" r="3"/>
    <circle cx="120" cy="212" r="3"/><circle cx="200" cy="212" r="3"/><circle cx="280" cy="212" r="3"/>
    <circle cx="360" cy="212" r="3"/><circle cx="440" cy="212" r="3"/><circle cx="520" cy="212" r="3"/>
    <circle cx="600" cy="212" r="3"/><circle cx="680" cy="212" r="3"/>
  </g>

  <!-- 상권 분석 곡선 -->
  <path d="M120 250 C210 176, 268 300, 360 220 S520 130, 600 196 S708 170, 700 158"
        fill="none" stroke="#b3262e" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#cc4a51">
    <circle cx="360" cy="220" r="7"/>
    <circle cx="600" cy="196" r="7"/>
  </g>

  <!-- 막대 -->
  <g fill="url(#w6bar)">
    <rect x="120" y="396" width="52" height="124"/>
    <rect x="200" y="348" width="52" height="172"/>
    <rect x="280" y="420" width="52" height="100"/>
    <rect x="360" y="312" width="52" height="208"/>
    <rect x="440" y="372" width="52" height="148"/>
    <rect x="520" y="330" width="52" height="190"/>
    <rect x="600" y="408" width="52" height="112"/>
  </g>
  <rect x="360" y="312" width="52" height="7" fill="#b3262e"/>

  <!-- 기준선 -->
  <rect x="100" y="520" width="600" height="2" fill="#ffffff" opacity="0.15"/>
</svg>
