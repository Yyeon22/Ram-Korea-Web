<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="단지 배치도를 추상화한 그래픽">
  <defs>
    <linearGradient id="w2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27313f"/>
      <stop offset="1" stop-color="#131a23"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#w2bg)"/>

  <!-- 배치 그리드 -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 120H800M0 240H800M0 360H800M0 480H800"/>
    <path d="M160 0V600M320 0V600M480 0V600M640 0V600"/>
  </g>

  <!-- 주동 배치 (평면 매스) -->
  <g fill="#ffffff">
    <rect x="96"  y="150" width="150" height="46" opacity="0.15"/>
    <rect x="96"  y="222" width="150" height="46" opacity="0.15"/>
    <rect x="286" y="150" width="46"  height="190" opacity="0.13"/>
    <rect x="380" y="186" width="190" height="46" opacity="0.16"/>
    <rect x="380" y="258" width="118" height="46" opacity="0.12"/>
    <rect x="596" y="150" width="46"  height="154" opacity="0.14"/>
    <rect x="150" y="380" width="46"  height="150" opacity="0.12"/>
    <rect x="240" y="404" width="190" height="46" opacity="0.15"/>
    <rect x="474" y="380" width="46"  height="150" opacity="0.13"/>
    <rect x="564" y="404" width="118" height="46" opacity="0.11"/>
  </g>

  <!-- 중심 광장 -->
  <circle cx="400" cy="340" r="34" fill="none" stroke="#b3262e" stroke-width="3"/>
  <circle cx="400" cy="340" r="7" fill="#b3262e"/>

  <!-- 주 동선 -->
  <path d="M0 340H360M440 340H800" stroke="#cc4a51" stroke-opacity="0.35" stroke-width="2"/>
</svg>
