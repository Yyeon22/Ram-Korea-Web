<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="사람을 중심에 둔 도시를 추상화한 그래픽">
  <defs>
    <linearGradient id="apbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3543"/>
      <stop offset="0.55" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#131a23"/>
    </linearGradient>
    <radialGradient id="apglow" cx="0.5" cy="0.52" r="0.42">
      <stop offset="0" stop-color="#b3262e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#b3262e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#apbg)"/>

  <!-- 둘러싼 도시 매스 -->
  <g fill="#ffffff" opacity="0.06">
    <rect x="40"  y="250" width="78" height="350"/>
    <rect x="134" y="320" width="62" height="280"/>
    <rect x="604" y="290" width="70" height="310"/>
    <rect x="690" y="236" width="74" height="364"/>
  </g>
  <g fill="#ffffff" opacity="0.10">
    <rect x="212" y="392" width="58" height="208"/>
    <rect x="530" y="368" width="58" height="232"/>
  </g>

  <!-- 중심 온기 -->
  <circle cx="400" cy="312" r="250" fill="url(#apglow)"/>

  <!-- 사람 — 동심원으로 모이는 구성 -->
  <circle cx="400" cy="312" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
  <circle cx="400" cy="312" r="98"  fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1.5"/>

  <g fill="#ffffff">
    <circle cx="400" cy="214" r="17" opacity="0.92"/>
    <circle cx="485" cy="263" r="14" opacity="0.62"/>
    <circle cx="485" cy="361" r="14" opacity="0.62"/>
    <circle cx="400" cy="410" r="14" opacity="0.62"/>
    <circle cx="315" cy="361" r="14" opacity="0.62"/>
    <circle cx="315" cy="263" r="14" opacity="0.62"/>
  </g>
  <g fill="#cc4a51" opacity="0.72">
    <circle cx="550" cy="312" r="10"/>
    <circle cx="250" cy="312" r="10"/>
    <circle cx="400" cy="162" r="10"/>
  </g>

  <!-- 중심 -->
  <circle cx="400" cy="312" r="34" fill="#b3262e"/>
  <circle cx="400" cy="312" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2"/>

  <!-- 지반 -->
  <rect x="0" y="566" width="800" height="1.5" fill="#ffffff" opacity="0.12"/>
</svg>
