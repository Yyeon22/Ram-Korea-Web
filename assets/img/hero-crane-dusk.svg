<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="해질녘 도시 스카이라인과 타워크레인">
  <title>해질녘 도시 스카이라인과 타워크레인 (임시 이미지)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101a29"/>
      <stop offset="34%" stop-color="#1f2b42"/>
      <stop offset="60%" stop-color="#42364f"/>
      <stop offset="80%" stop-color="#7c4a4c"/>
      <stop offset="100%" stop-color="#c47a4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.9" r="0.55">
      <stop offset="0%" stop-color="#ffb367" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#e08a52" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e08a52" stop-opacity="0"/>
    </radialGradient>
    <pattern id="win" width="15" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="5" width="6" height="10" fill="#ffd8a3"/>
    </pattern>
    <pattern id="winS" width="11" height="17" patternUnits="userSpaceOnUse">
      <rect x="2" y="4" width="5" height="7" fill="#ffe0b0"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- 하늘 -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="990" cy="810" rx="720" ry="360" fill="url(#glow)"/>

  <!-- 구름 -->
  <g fill="#ffffff" opacity="0.07">
    <ellipse cx="300" cy="180" rx="230" ry="26"/>
    <ellipse cx="1240" cy="250" rx="300" ry="30"/>
    <ellipse cx="820" cy="120" rx="180" ry="18"/>
  </g>

  <!-- 원경 스카이라인 -->
  <g fill="#1b2434" opacity="0.75">
    <rect x="0" y="600" width="90" height="300"/>
    <rect x="86" y="560" width="120" height="340"/>
    <rect x="200" y="620" width="70" height="280"/>
    <rect x="266" y="540" width="110" height="360"/>
    <rect x="372" y="610" width="130" height="290"/>
    <rect x="500" y="575" width="86" height="325"/>
    <rect x="582" y="628" width="140" height="272"/>
    <rect x="718" y="556" width="96" height="344"/>
    <rect x="810" y="612" width="128" height="288"/>
    <rect x="934" y="580" width="88" height="320"/>
    <rect x="1018" y="632" width="150" height="268"/>
    <rect x="1164" y="566" width="104" height="334"/>
    <rect x="1264" y="618" width="128" height="282"/>
    <rect x="1388" y="572" width="96" height="328"/>
    <rect x="1480" y="624" width="120" height="276"/>
  </g>
  <g fill="url(#winS)" opacity="0.28">
    <rect x="86" y="560" width="120" height="340"/>
    <rect x="266" y="540" width="110" height="360"/>
    <rect x="718" y="556" width="96" height="344"/>
    <rect x="1164" y="566" width="104" height="334"/>
    <rect x="1388" y="572" width="96" height="328"/>
  </g>

  <!-- 근경 빌딩 -->
  <g fill="#111924">
    <rect x="-20" y="700" width="180" height="200"/>
    <rect x="150" y="660" width="150" height="240"/>
    <rect x="292" y="726" width="190" height="174"/>
    <rect x="470" y="688" width="128" height="212"/>
    <rect x="596" y="740" width="210" height="160"/>
    <rect x="796" y="672" width="140" height="228"/>
    <rect x="928" y="736" width="186" height="164"/>
    <rect x="1106" y="696" width="132" height="204"/>
    <rect x="1230" y="742" width="200" height="158"/>
    <rect x="1422" y="684" width="200" height="216"/>
  </g>
  <g fill="url(#win)" opacity="0.4">
    <rect x="150" y="660" width="150" height="240"/>
    <rect x="470" y="688" width="128" height="212"/>
    <rect x="796" y="672" width="140" height="228"/>
    <rect x="1106" y="696" width="132" height="204"/>
    <rect x="1422" y="684" width="200" height="216"/>
  </g>

  <!-- 타워크레인 1 -->
  <g stroke="#0c131c" stroke-width="7" fill="none" stroke-linecap="square">
    <path d="M436 760 L436 150"/>
    <path d="M412 760 L436 150 M460 760 L436 150" stroke-width="3" opacity="0.8"/>
    <path d="M250 196 L790 196" stroke-width="8"/>
    <path d="M250 214 L790 214" stroke-width="3" opacity="0.7"/>
    <path d="M436 92 L786 194 M436 92 L254 194" stroke-width="3"/>
    <path d="M436 150 L436 92" stroke-width="5"/>
    <path d="M660 214 L660 420" stroke-width="2.5"/>
  </g>
  <g fill="#0c131c">
    <rect x="243" y="182" width="66" height="34"/>
    <rect x="640" y="418" width="40" height="22"/>
    <rect x="404" y="214" width="64" height="40"/>
  </g>
  <g fill="#ff5a4a">
    <circle cx="436" cy="86" r="6"/>
    <circle cx="786" cy="196" r="5"/>
  </g>

  <!-- 타워크레인 2 -->
  <g stroke="#0d141e" stroke-width="5" fill="none" stroke-linecap="square" opacity="0.92">
    <path d="M1150 740 L1150 268"/>
    <path d="M1132 740 L1150 268 M1168 740 L1150 268" stroke-width="2.4" opacity="0.8"/>
    <path d="M1000 302 L1428 302" stroke-width="6"/>
    <path d="M1000 316 L1428 316" stroke-width="2.4" opacity="0.7"/>
    <path d="M1150 224 L1424 300 M1150 224 L1004 300" stroke-width="2.4"/>
    <path d="M1150 268 L1150 224" stroke-width="4"/>
    <path d="M1310 316 L1310 470" stroke-width="2"/>
