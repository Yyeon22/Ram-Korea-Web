    <rect x="1294" y="468" width="32" height="18"/>
    <rect x="1126" y="316" width="48" height="30"/>
  </g>
  <g fill="#ff5a4a">
    <circle cx="1150" cy="219" r="5"/>
    <circle cx="1424" cy="302" r="4"/>
