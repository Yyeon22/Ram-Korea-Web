<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="해질녘 도시 스카이라인">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0f151d"/>
      <stop offset="0.38" stop-color="#1b2431"/>
      <stop offset="0.68" stop-color="#3a2b34"/>
      <stop offset="0.86" stop-color="#6b3a3c"/>
      <stop offset="1"    stop-color="#8f4038"/>
    </linearGradient>
    <radialGradient id="hsun" cx="0.72" cy="0.86" r="0.46">
      <stop offset="0"   stop-color="#e08a5a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#D93128" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#D93128" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hfar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d131b" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0d131b" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="hmid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1119" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#0b1119" stop-opacity="0.95"/>
    </linearGradient>
    <!-- CSS(.hero__bg::after)에서 한 번 더 어둡게 덮으므로 여기서는 약하게만 정리한다 -->
    <linearGradient id="hveil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0f151d" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#0f151d" stop-opacity="0.04"/>
      <stop offset="1"    stop-color="#0b1119" stop-opacity="0.58"/>
    </linearGradient>
  </defs>

  <!-- 하늘 -->
  <rect width="1600" height="900" fill="url(#hsky)"/>
  <rect width="1600" height="900" fill="url(#hsun)"/>

  <!-- 원경 스카이라인 -->
  <g fill="url(#hfar)">
    <rect x="0"    y="560" width="120" height="340"/>
    <rect x="132"  y="612" width="96"  height="288"/>
    <rect x="240"  y="524" width="108" height="376"/>
    <rect x="360"  y="596" width="130" height="304"/>
    <rect x="502"  y="548" width="98"  height="352"/>
    <rect x="612"  y="620" width="120" height="280"/>
    <rect x="744"  y="566" width="104" height="334"/>
    <rect x="860"  y="608" width="126" height="292"/>
    <rect x="998"  y="540" width="110" height="360"/>
    <rect x="1120" y="600" width="98"  height="300"/>
    <rect x="1230" y="558" width="132" height="342"/>
    <rect x="1374" y="616" width="106" height="284"/>
    <rect x="1492" y="572" width="108" height="328"/>
  </g>

  <!-- 타워크레인 (원경, 실루엣) -->
  <g stroke="#0d131b" stroke-opacity="0.66" fill="none" stroke-width="5">
    <path d="M300 250V590"/>
    <path d="M150 250H470"/>
    <path d="M300 250L150 292M300 250L470 292"/>
    <path d="M410 250V318"/>
  </g>
  <rect x="396" y="312" width="30" height="22" fill="#0d131b" fill-opacity="0.66"/>
  <circle cx="300" cy="246" r="6" fill="#E8615A" opacity="0.85"/>

  <g stroke="#0b1119" stroke-opacity="0.74" fill="none" stroke-width="6">
    <path d="M1180 190V560"/>
    <path d="M1010 190H1390"/>
    <path d="M1180 190L1010 236M1180 190L1390 236"/>
    <path d="M1096 190V272"/>
  </g>
  <rect x="1080" y="266" width="34" height="26" fill="#0b1119" fill-opacity="0.74"/>
  <circle cx="1180" cy="186" r="7" fill="#E8615A" opacity="0.9"/>

  <!-- 근경 건물 매스 -->
  <g fill="url(#hmid)">
    <rect x="-20"  y="690" width="260" height="230"/>
    <rect x="250"  y="742" width="212" height="178"/>
    <rect x="470"  y="666" width="196" height="254"/>
    <rect x="676"  y="748" width="238" height="172"/>
    <rect x="922"  y="700" width="204" height="220"/>
    <rect x="1136" y="756" width="226" height="164"/>
    <rect x="1372" y="708" width="248" height="212"/>
  </g>

  <!-- 창 불빛 -->
  <g fill="#f0b98a" opacity="0.30">
    <rect x="42"   y="726" width="12" height="18"/><rect x="82"  y="726" width="12" height="18"/>
    <rect x="122"  y="768" width="12" height="18"/><rect x="42"  y="810" width="12" height="18"/>
    <rect x="182"  y="726" width="12" height="18"/>
    <rect x="292"  y="786" width="12" height="18"/><rect x="352" y="828" width="12" height="18"/>
    <rect x="512"  y="704" width="12" height="18"/><rect x="572" y="746" width="12" height="18"/>
    <rect x="512"  y="830" width="12" height="18"/><rect x="612" y="704" width="12" height="18"/>
    <rect x="726"  y="790" width="12" height="18"/><rect x="826" y="832" width="12" height="18"/>
    <rect x="962"  y="738" width="12" height="18"/><rect x="1042" y="780" width="12" height="18"/>
    <rect x="962"  y="864" width="12" height="18"/>
    <rect x="1186" y="798" width="12" height="18"/><rect x="1286" y="840" width="12" height="18"/>
    <rect x="1422" y="746" width="12" height="18"/><rect x="1522" y="788" width="12" height="18"/>
    <rect x="1422" y="872" width="12" height="18"/>
  </g>

  <!-- 전체 톤 정리 -->
  <rect width="1600" height="900" fill="url(#hveil)"/>
</svg>
